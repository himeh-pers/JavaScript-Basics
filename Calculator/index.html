<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="calculator">
            <div id="screen">
                <p id="expression"></p>
                <p id="display">0</p>
            </div>
            <div id="buttons">
                <button class="clear" onclick="clearAll()">Clear</button>
                <button class="operator" onclick="pressOperator('/')">&divide;</button>

                <button onclick="pressDigit('7')">7</button>
                <button onclick="pressDigit('8')">8</button>
                <button onclick="pressDigit('9')">9</button>
                <button class="operator" onclick="pressOperator('*')">&times;</button>

                <button onclick="pressDigit('4')">4</button>
                <button onclick="pressDigit('5')">5</button>
                <button onclick="pressDigit('6')">6</button>
                <button class="operator" onclick="pressOperator('-')">&minus;</button>

                <button onclick="pressDigit('1')">1</button>
                <button onclick="pressDigit('2')">2</button>
                <button onclick="pressDigit('3')">3</button>
                <button class="operator" onclick="pressOperator('+')">+</button>

                <button class="zero" onclick="pressDigit('0')">0</button>
                <button onclick="pressDigit('.')">.</button>
                <button class="equals" onclick="pressEquals()">=</button>

            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
